<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#141414"/>

  <!-- Concentric ring hints -->
  <circle cx="400" cy="225" r="160" stroke="#1E1E1E" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="400" cy="225" r="100" stroke="#242424" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Spoke connections -->
  <line x1="400" y1="125" x2="260" y2="70"  stroke="#2A2A2A" stroke-width="1"/>
  <line x1="400" y1="125" x2="540" y2="70"  stroke="#2A2A2A" stroke-width="1"/>
  <line x1="300" y1="225" x2="160" y2="160" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="300" y1="225" x2="160" y2="300" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="500" y1="225" x2="640" y2="160" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="500" y1="225" x2="640" y2="300" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="400" y1="325" x2="260" y2="380" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="400" y1="325" x2="540" y2="380" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Outer nodes -->
  <circle cx="260" cy="70"  r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="540" cy="70"  r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="160" cy="160" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="640" cy="160" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="160" cy="300" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="640" cy="300" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="260" cy="380" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <circle cx="540" cy="380" r="22" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Node icons (simple shapes) -->
  <text x="253" y="75"  font-family="monospace" font-size="10" fill="#555" text-anchor="middle">P&L</text>
  <text x="540" y="75"  font-family="monospace" font-size="10" fill="#555" text-anchor="middle">CF</text>
  <text x="160" y="165" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">D/E</text>
  <text x="640" y="165" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">ROE</text>
  <text x="160" y="305" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">LTV</text>
  <text x="640" y="305" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">CR</text>
  <text x="260" y="385" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">IR</text>
  <text x="540" y="385" font-family="monospace" font-size="10" fill="#555" text-anchor="middle">NI</text>

  <!-- Central hub -->
  <circle cx="400" cy="225" r="46" fill="#1A1A1A" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="400" cy="225" r="10" fill="#4ade80" opacity="0.7"/>
  <circle cx="400" cy="225" r="18" fill="#4ade80" opacity="0.08"/>

  <!-- PD score arc (partial circle, top) -->
  <path
    d="M 358 225 A 42 42 0 0 1 442 225"
    stroke="#4ade80"
    stroke-width="2"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Labels -->
  <text x="40" y="44" font-family="monospace" font-size="11" fill="#555" letter-spacing="2">CREDITLENS</text>
  <text x="40" y="64" font-family="monospace" font-size="9"  fill="#333" letter-spacing="1">AI Credit Risk Assessment</text>

  <!-- Score callout -->
  <rect x="560" y="26" width="200" height="52" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <text x="576" y="46" font-family="monospace" font-size="9"  fill="#555">PD SCORE</text>
  <text x="576" y="64" font-family="monospace" font-size="16" fill="#4ade80" font-weight="bold">3.2%</text>
  <text x="634" y="64" font-family="monospace" font-size="9"  fill="#555" dy="-2">LOW RISK</text>
</svg>
