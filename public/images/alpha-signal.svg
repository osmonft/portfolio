<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#141414"/>

  <!-- Subtle grid -->
  <line x1="0" y1="112" x2="800" y2="112" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="0" y1="337" x2="800" y2="337" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="450" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="450" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="450" stroke="#1E1E1E" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="450" stroke="#1E1E1E" stroke-width="1"/>

  <!-- Candlestick bars (simplified) -->
  <rect x="80"  y="280" width="14" height="60"  fill="#888" opacity="0.5"/>
  <rect x="120" y="260" width="14" height="80"  fill="#888" opacity="0.5"/>
  <rect x="160" y="240" width="14" height="50"  fill="#4ade80" opacity="0.6"/>
  <rect x="200" y="220" width="14" height="70"  fill="#888" opacity="0.5"/>
  <rect x="240" y="200" width="14" height="40"  fill="#4ade80" opacity="0.6"/>
  <rect x="280" y="190" width="14" height="55"  fill="#4ade80" opacity="0.6"/>
  <rect x="320" y="210" width="14" height="65"  fill="#888" opacity="0.5"/>
  <rect x="360" y="175" width="14" height="55"  fill="#4ade80" opacity="0.6"/>
  <rect x="400" y="150" width="14" height="60"  fill="#4ade80" opacity="0.6"/>
  <rect x="440" y="160" width="14" height="70"  fill="#888" opacity="0.5"/>
  <rect x="480" y="130" width="14" height="55"  fill="#4ade80" opacity="0.6"/>
  <rect x="520" y="120" width="14" height="45"  fill="#4ade80" opacity="0.6"/>
  <rect x="560" y="140" width="14" height="60"  fill="#888" opacity="0.5"/>
  <rect x="600" y="110" width="14" height="50"  fill="#4ade80" opacity="0.6"/>
  <rect x="640" y="95"  width="14" height="55"  fill="#4ade80" opacity="0.6"/>
  <rect x="680" y="105" width="14" height="65"  fill="#888" opacity="0.5"/>

  <!-- Signal line -->
  <polyline
    points="87,305 127,290 167,255 207,245 247,215 287,205 327,230 367,190 407,168 447,180 487,145 527,132 567,155 607,120 647,105 687,130"
    stroke="#4ade80"
    stroke-width="2"
    fill="none"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Glow on the line terminal -->
  <circle cx="687" cy="130" r="5" fill="#4ade80" opacity="0.9"/>
  <circle cx="687" cy="130" r="10" fill="#4ade80" opacity="0.15"/>

  <!-- Area under curve -->
  <polygon
    points="87,305 127,290 167,255 207,245 247,215 287,205 327,230 367,190 407,168 447,180 487,145 527,132 567,155 607,120 647,105 687,130 687,380 87,380"
    fill="#4ade80"
    fill-opacity="0.04"
  />

  <!-- Labels -->
  <text x="40" y="44" font-family="monospace" font-size="11" fill="#555" letter-spacing="2">ALPHA SIGNAL ENGINE</text>
  <text x="40" y="64" font-family="monospace" font-size="9"  fill="#333" letter-spacing="1">Quantitative Research Pipeline</text>

  <!-- Stat callouts -->
  <rect x="560" y="26" width="200" height="52" rx="2" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
  <text x="576" y="46" font-family="monospace" font-size="9"  fill="#555">SHARPE RATIO</text>
  <text x="576" y="64" font-family="monospace" font-size="16" fill="#4ade80" font-weight="bold">1.84</text>
  <text x="650" y="64" font-family="monospace" font-size="9"  fill="#555" dy="-2">↑ 12%</text>
</svg>
